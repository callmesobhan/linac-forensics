[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "linac-forensics"
version = "0.1.0"
description = "Closed-Loop Linac Telemetry, EPID & Perturbative 3D Delivery-Forensics Engine with Frontier Agent Harness & MCP Server (Research Software — NOT A MEDICAL DEVICE)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Sobhan", email = "research@linac-forensics.org" }
]
keywords = [
  "medical-physics",
  "radiotherapy",
  "linac",
  "trajectory-log",
  "AAPM-TG-142",
  "AAPM-TG-218",
  "DVH",
  "MLC",
  "MCP",
  "causal-inference"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "pydantic>=2.7.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
linac-forensics-mcp = "linac_forensics.harness.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linac_forensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -W error"
filterwarnings = [
  "error",
]

[tool.coverage.run]
source = ["src/linac_forensics"]
branch = false

[tool.coverage.report]
show_missing = true
precision = 1

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
