name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run Ruff lint checks
        run: uv run --python ${{ matrix.python-version }} ruff check src tests scripts

      - name: Run pytest with coverage gate (>= 75%) and zero warnings
        run: >
          uv run --python ${{ matrix.python-version }}
          pytest --cov=linac_forensics --cov-fail-under=75 --cov-report=term-missing

      - name: Verify MCP server initialize & tools/list over stdio
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n' \
            | uv run --python ${{ matrix.python-version }} linac-forensics-mcp \
            | grep -q "linac_diagnose_causal_fault"
